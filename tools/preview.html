<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Fira Sans";font-weight:900;src:url(../assets/fonts/FiraSans-900.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:400;src:url(../assets/fonts/Overpass-400.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:600;src:url(../assets/fonts/Overpass-600.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:700;src:url(../assets/fonts/Overpass-700.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;font-family:Overpass;color:#07173F;overflow:hidden;position:relative}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,66,166,.10)}
.thread{position:absolute;left:0;right:0;top:0;height:3px;background:url(../assets/kente.png) repeat-x 0 0/auto 3px}
.left{position:absolute;left:64px;top:96px;width:600px}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#0042A6}
h1{font-family:"Fira Sans";font-weight:900;font-size:66px;line-height:1.02;letter-spacing:.04em;
   text-transform:uppercase;margin-top:20px}
h1 span{color:#0042A6}
p.sub{margin-top:22px;font-size:20px;line-height:1.5;color:#4A5878;max-width:30ch}
.logos{display:flex;align-items:center;gap:22px;margin-top:38px}
.logos img{max-height:34px;max-width:92px;width:auto;object-fit:contain}
.card{position:absolute;right:56px;top:20px;width:472px;height:590px;background:#fff;
      box-shadow:0 18px 50px rgba(7,23,63,.16);overflow:hidden}
.card img.layer{position:absolute;inset:0;width:100%;height:100%}
.card .photo{position:absolute;left:calc(50% - 132px);top:56px;width:264px;height:264px;
             border-radius:50%;overflow:hidden}
.card .photo img{width:100%;height:100%;object-fit:cover}
.card .name{position:absolute;left:0;right:0;top:356px;text-align:center;font-family:"Fira Sans";
            font-weight:900;font-size:37px;letter-spacing:.03em;text-transform:uppercase;color:#07173F}
</style>
</head>
<body>
<div class="thread"></div>
<div class="ring" style="width:520px;height:520px;right:-140px;top:-180px"></div>
<div class="ring" style="width:700px;height:700px;right:-230px;top:-270px"></div>

<div class="left">
  <p class="eyebrow">Participant card maker</p>
  <h1>Proof you<br>were <span>there</span></h1>
  <p class="sub">One photo and your name, then download your card for the feed.</p>
  <div class="logos">
    <img src="../assets/collaborators/astroxmat-trim.png" alt="">
    <img src="../assets/collaborators/dipper-trim.png" alt="">
    <img src="../assets/collaborators/elearning-trim.png" alt="">
    <img src="../assets/collaborators/gsc-plate.png" alt="">
  </div>
</div>

<div class="card">
  <img class="layer" src="../assets/layer-participant.png" alt="">
  <div class="photo"><img src="../assets/official-earth.jpg" alt=""></div>
  <div class="name">Ama Mensah</div>
</div>
</body>
</html>
