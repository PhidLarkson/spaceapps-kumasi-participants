<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Fira Sans";font-weight:900;src:url(../assets/fonts/FiraSans-900.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:400;src:url(../assets/fonts/Overpass-400.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:600;src:url(../assets/fonts/Overpass-600.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:700;src:url(../assets/fonts/Overpass-700.woff2) format("woff2")}

/* one grid: 80px margins, 920px measure, 1080 x 1350 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#fff;-webkit-font-smoothing:antialiased}
#card{position:relative;width:1080px;height:1350px;background:#fff;overflow:hidden}
.abs{position:absolute}

/* header: the two marks get the weight */
.brand{left:80px;top:52px;display:flex;align-items:center;gap:22px}
.brand img.a{height:82px;width:auto}
.brand .div{width:1px;height:66px;background:#C9D3E6}
.brand img.b{height:82px;width:auto}
.when{right:80px;top:60px;text-align:right;font-family:Overpass;font-weight:700;font-size:20px;
      letter-spacing:.12em;color:#07173F;line-height:1.55;text-transform:uppercase}
.when span{display:block;font-weight:600;font-size:18px;color:#0042A6}

.rule{left:80px;width:920px;height:1px;background:#D5DCEA}

/* orbits, concentric on the photo */
.orbits{left:0;top:0}

/* the statement: Fira Sans Black, all caps, 5% tracking */
.head{left:80px;top:204px;width:920px;font-family:"Fira Sans";font-weight:900;font-size:68px;
      line-height:1.1;letter-spacing:.05em;text-transform:uppercase;color:#07173F}
.head span{display:block}
.head .place{color:#0042A6}

/* role, on the name's optical line */
.role{right:80px;top:1116px;font-family:Overpass;font-weight:700;font-size:18px;
      letter-spacing:.2em;text-transform:uppercase;color:#0042A6}

/* collaborators: two rows of four, room to read them */
.colab{left:80px;top:1176px;font-family:Overpass;font-weight:700;font-size:17px;
       letter-spacing:.2em;text-transform:uppercase;color:#4A5878}
.strip{left:80px;width:920px;height:34px;top:1216px;display:flex;align-items:center;
       justify-content:space-between}
.strip img{max-height:34px;max-width:160px;width:auto;height:auto;object-fit:contain}

/* foot */
.foot{left:80px;width:920px;top:1288px;display:flex;justify-content:space-between;
      font-family:Overpass;font-weight:600;font-size:16px;letter-spacing:.14em;
      text-transform:uppercase;color:#4A5878}
.kente{left:0;right:0;bottom:0;height:6px;background:url(../assets/kente.png) repeat-x 0 0/auto 6px}
</style>
</head>
<body>
<div id="card">

  <svg class="abs orbits" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
    <g stroke="#0042A6" fill="none">
      <circle cx="540" cy="720" r="260" stroke="#07173F" stroke-width="1.5" stroke-opacity=".9"/>
      <circle cx="540" cy="720" r="302" stroke-width="1.5" stroke-opacity=".12"/>
    </g>
    <circle cx="771" cy="914" r="13" fill="#EAFE07" stroke="#07173F" stroke-width="2"/>
  </svg>

  <div class="abs brand">
    <img class="a" src="../assets/default-black.svg" alt="">
    <div class="div"></div>
    <img class="b" src="../assets/cityh-black.svg" alt="">
  </div>
  <div class="abs when">14&ndash;15 Nov 2026<span>KNUST, Kumasi</span></div>
  <div class="abs rule" style="top:152px"></div>

  <h1 class="abs head">
    <span>See you at the</span>
    <span>NASA Space Apps <em class="place" style="font-style:normal">Kumasi</em></span>
  </h1>

  <div class="abs role">Participant</div>

  <div class="abs rule" style="top:1160px"></div>
  <div class="abs colab">Our local collaborators</div>
  <div class="abs strip">
    <img src="../assets/collaborators/elearning-trim.png" alt="">
    <img src="../assets/collaborators/ofwa-ink-trim.png" alt="">
    <img src="../assets/collaborators/dipper-trim.png" alt="">
    <img src="../assets/collaborators/astroxmat-trim.png" alt="">
    <img src="../assets/collaborators/gsc-plate.png" alt="">
    <img src="../assets/collaborators/lidn-official-trim.png" alt="">
    <img src="../assets/collaborators/sca-ga.png" alt="">
    <img src="../assets/collaborators/ghie-logo.png" alt="">
  </div>

  <div class="abs rule" style="top:1268px"></div>
  <div class="abs foot"><span>NASA Space Apps Kumasi</span><span>#SpaceAppsKumasi</span></div>
  <div class="abs kente"></div>

</div>
</body>
</html>
