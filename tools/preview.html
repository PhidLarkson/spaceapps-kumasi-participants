<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Fira Sans";font-weight:900;src:url(../assets/fonts/FiraSans-900.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:400;src:url(../assets/fonts/Overpass-400.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:600;src:url(../assets/fonts/Overpass-600.woff2) format("woff2")}
@font-face{font-family:"Overpass";font-weight:700;src:url(../assets/fonts/Overpass-700.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;font-family:Overpass;color:#07173F;overflow:hidden;position:relative}
.thread{position:absolute;left:0;right:0;top:0;height:3px;background:url(../assets/kente.png) repeat-x 0 0/auto 3px}
.left{position:absolute;left:64px;top:96px;width:560px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#0042A6}
h1{font-family:"Fira Sans";font-weight:900;font-size:48px;line-height:1.1;letter-spacing:.05em;
   text-transform:uppercase;margin-top:22px}
h1 span{display:block}
h1 .place{color:#0042A6}
p.sub{margin-top:24px;font-size:19px;line-height:1.5;color:#4A5878;max-width:40ch}
.hair{position:absolute;left:64px;width:560px;top:496px;height:1px;background:#D5DCEA}
.logos{position:absolute;left:64px;width:560px;top:520px;display:flex;align-items:center;
       justify-content:space-between}
.logos img{max-height:25px;max-width:86px;width:auto;object-fit:contain}
.card{position:absolute;right:56px;top:20px;width:472px;height:590px;background:#fff;
      box-shadow:0 20px 54px rgba(7,23,63,.15);overflow:hidden}
.card img.layer{position:absolute;inset:0;width:100%;height:100%}
/* 0.437037 scale of the 1080 x 1350 card */
.card .photo{position:absolute;left:126.7px;top:205.4px;width:218.5px;height:218.5px;
             border-radius:50%;overflow:hidden}
.card .photo img{width:100%;height:100%;object-fit:cover}
.card .name{position:absolute;left:35px;top:475px;width:306px;font-family:"Fira Sans";
            font-weight:900;font-size:25.3px;line-height:1.1;letter-spacing:.05em;
            text-transform:uppercase;color:#07173F}
</style>
</head>
<body>
<div class="thread"></div>

<div class="hair"></div>

<div class="left">
  <p class="eyebrow">Participant card maker</p>
  <h1>
    <span>See you at the</span>
    <span>NASA Space Apps <em class="place" style="font-style:normal">Kumasi</em></span>
  </h1>
  <p class="sub">Add a photo and your name. 14 &ndash; 15 November 2026, KNUST.</p>
</div>

<div class="logos">
  <img src="../assets/collaborators/elearning-trim.png" alt="">
  <img src="../assets/collaborators/ofwa-ink-trim.png" alt="">
  <img src="../assets/collaborators/dipper-trim.png" alt="">
  <img src="../assets/collaborators/astroxmat-trim.png" alt="">
  <img src="../assets/collaborators/gsc-plate.png" alt="">
  <img src="../assets/collaborators/lidn-official-trim.png" alt="">
  <img src="../assets/collaborators/sca-ga.png" alt="">
  <img src="../assets/collaborators/ghie-logo.png" alt="">
</div>

<div class="card">
  <img class="layer" src="../assets/layer-participant.png" alt="">
  <div class="photo"><img src="../assets/official-earth.jpg" alt=""></div>
  <div class="name">Ama Mensah</div>
</div>
</body>
</html>
